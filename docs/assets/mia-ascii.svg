<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Dark Obsidian Gradient Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0D" />
      <stop offset="50%" stop-color="#140607" />
      <stop offset="100%" stop-color="#0A0A0D" />
    </linearGradient>

    <!-- Crimson Red Glow Filter -->
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Deep Crimson Radial Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#B61C1C" stop-opacity="0" />
      <stop offset="100%" stop-color="#B61C1C" stop-opacity="0.15" />
    </radialGradient>
  </defs>

  <!-- Background Rect -->
  <rect width="900" height="320" rx="12" fill="url(#bgGradient)" stroke="#B61C1C" stroke-width="1.5" stroke-opacity="0.4" />
  <rect width="900" height="320" rx="12" fill="url(#vignette)" />

  <!-- Background Ambient ASCII Grid -->
  <g opacity="0.15" fill="#B61C1C" font-family="Courier New, monospace" font-size="10">
    <text x="30" y="40">01001101 01001001 01000001 01001101 01001001 01000001 01001101 01001001 01000001 01001101 01001001</text>
    <text x="30" y="60">M.I.A // MACHINE INTELLIGENCE ARCHITECTURE // ASCII MATRIX COLOR #B61C1C // SYSTEM RUNTIME READY</text>
    <text x="30" y="270">==========================================================================================</text>
    <text x="30" y="290">01001101 01001001 01000001 01001101 01001001 01000001 01001101 01001001 01000001 01001101 01001001</text>
  </g>

  <!-- Main Hero MIA ASCII Block -->
  <g filter="url(#crimsonGlow)" font-family="Consolas, Monaco, 'Courier New', monospace" font-weight="900" font-size="28" letter-spacing="1">
    <!-- Drop Shadow Layer -->
    <text x="142" y="112" fill="#3D0505" opacity="0.8">  ███╗   ███╗██╗ █████╗ </text>
    <text x="142" y="142" fill="#3D0505" opacity="0.8">  ████╗ ████║██║██╔══██╗</text>
    <text x="142" y="172" fill="#3D0505" opacity="0.8">  ██╔████╔██║██║███████║</text>
    <text x="142" y="202" fill="#3D0505" opacity="0.8">  ██║╚██╔╝██║██║██╔══██║</text>
    <text x="142" y="232" fill="#3D0505" opacity="0.8">  ██║ ╚═╝ ██║██║██║  ██║</text>

    <!-- Main Crimson Layer #B61C1C -->
    <text x="140" y="110" fill="#FF3E3E">  ███╗   ███╗██╗ █████╗ </text>
    <text x="140" y="140" fill="#B61C1C">  ████╗ ████║██║██╔══██╗</text>
    <text x="140" y="170" fill="#B61C1C">  ██╔████╔██║██║███████║</text>
    <text x="140" y="200" fill="#B61C1C">  ██║╚██╔╝██║██║██╔══██║</text>
    <text x="140" y="230" fill="#FF3E3E">  ██║ ╚═╝ ██║██║██║  ██║</text>
  </g>

  <!-- Subtitle Badge -->
  <g transform="translate(290, 260)">
    <rect x="0" y="0" width="320" height="26" rx="13" fill="#B61C1C" fill-opacity="0.2" stroke="#B61C1C" stroke-width="1" />
    <text x="160" y="17" fill="#FF3E3E" font-family="Consolas, Monaco, monospace" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="2">MACHINE INTELLIGENCE ARCHITECTURE</text>
  </g>
</svg>
