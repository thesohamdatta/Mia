<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulseGlow {
        0%, 100% {
          fill: #B61C1C;
          filter: drop-shadow(0px 0px 8px rgba(182, 28, 28, 0.8));
        }
        50% {
          fill: #FF3E3E;
          filter: drop-shadow(0px 0px 18px rgba(255, 62, 62, 1.0));
        }
      }

      @keyframes matrixStream {
        0% { transform: translateY(0px); opacity: 0.15; }
        50% { opacity: 0.35; }
        100% { transform: translateY(-30px); opacity: 0.15; }
      }

      @keyframes shimmerWave {
        0% { stop-color: #B61C1C; }
        50% { stop-color: #FF3E3E; }
        100% { stop-color: #B61C1C; }
      }

      .ascii-main {
        font-family: Consolas, Monaco, 'Fira Code', 'Courier New', monospace;
        font-weight: 900;
        font-size: 29px;
        animation: pulseGlow 3s ease-in-out infinite;
      }

      .matrix-rain {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        fill: #B61C1C;
        animation: matrixStream 4s linear infinite alternate;
      }

      .subtitle {
        font-family: 'Consolas', Monaco, monospace;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 2.5px;
        fill: #FF3E3E;
      }
    </style>

    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0D" />
      <stop offset="50%" stop-color="#180608" />
      <stop offset="100%" stop-color="#0A0A0D" />
    </linearGradient>

    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B61C1C">
        <animate attributeName="stop-color" values="#B61C1C; #FF3E3E; #B61C1C" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#FF3E3E">
        <animate attributeName="stop-color" values="#FF3E3E; #B61C1C; #FF3E3E" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="920" height="340" rx="14" fill="url(#bannerBg)" stroke="#B61C1C" stroke-width="1.8" stroke-opacity="0.5" />

  <!-- Animated Matrix Video Background Streams -->
  <g class="matrix-rain">
    <text x="35" y="45">@#$%*+=:. @#$%*+=:. @#$%*+=:. @#$%*+=:. @#$%*+=:. @#$%*+=:. @#$%*+=:.</text>
    <text x="35" y="70">01001101 01001001 01000001 // MIA MACHINE INTELLIGENCE ARCHITECTURE // #B61C1C</text>
    <text x="35" y="275">========================================================================================</text>
    <text x="35" y="300">@#$%*+=:. @#$%*+=:. @#$%*+=:. @#$%*+=:. @#$%*+=:. @#$%*+=:. @#$%*+=:.</text>
  </g>

  <!-- Animated Hero MIA ASCII Text -->
  <g class="ascii-main">
    <text x="145" y="115">  ███╗   ███╗██╗ █████╗ </text>
    <text x="145" y="145">  ████╗ ████║██║██╔══██╗</text>
    <text x="145" y="175">  ██╔████╔██║██║███████║</text>
    <text x="145" y="205">  ██║╚██╔╝██║██║██╔══██║</text>
    <text x="145" y="235">  ██║ ╚═╝ ██║██║██║  ██║</text>
  </g>

  <!-- Bottom Badge -->
  <g transform="translate(300, 275)">
    <rect x="0" y="0" width="320" height="26" rx="13" fill="#B61C1C" fill-opacity="0.25" stroke="url(#shimmerGrad)" stroke-width="1.2" />
    <text x="160" y="17" class="subtitle" text-anchor="middle">MACHINE INTELLIGENCE ARCHITECTURE</text>
  </g>
</svg>
