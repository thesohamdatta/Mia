<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <defs>
    <!-- Google Fonts import for Orbitron and JetBrains Mono -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&amp;family=Orbitron:wght@800;900&amp;display=swap');

      @keyframes pulseGlow {
        0%, 100% {
          fill: #B61C1C;
          filter: drop-shadow(0px 0px 10px rgba(182, 28, 28, 0.85));
        }
        50% {
          fill: #FF3E3E;
          filter: drop-shadow(0px 0px 22px rgba(255, 62, 62, 1.0));
        }
      }

      @keyframes matrixRain {
        0% { transform: translateY(0px); opacity: 0.12; }
        50% { opacity: 0.35; }
        100% { transform: translateY(-25px); opacity: 0.12; }
      }

      @keyframes borderShimmer {
        0% { stroke: #B61C1C; }
        50% { stroke: #FF3E3E; }
        100% { stroke: #B61C1C; }
      }

      .ascii-text {
        font-family: 'JetBrains Mono', Consolas, Monaco, monospace;
        font-weight: 900;
        font-size: 30px;
        animation: pulseGlow 3.5s ease-in-out infinite;
      }

      .matrix-stream {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        fill: #B61C1C;
        animation: matrixRain 4s linear infinite alternate;
      }

      .badge-title {
        font-family: 'Orbitron', sans-serif;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 3px;
        fill: #FF3E3E;
      }

      .card-border {
        animation: borderShimmer 4s ease-in-out infinite;
      }
    </style>

    <!-- Obsidian Background Gradient -->
    <linearGradient id="bgObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070A" />
      <stop offset="50%" stop-color="#1A0709" />
      <stop offset="100%" stop-color="#07070A" />
    </linearGradient>

    <!-- Crimson Ambient Radial Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#B61C1C" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#07070A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Card Background -->
  <rect width="960" height="360" rx="16" fill="url(#bgObsidian)" class="card-border" stroke-width="2" />
  <rect width="960" height="360" rx="16" fill="url(#ambientGlow)" />

  <!-- Scanline Cyber Pattern -->
  <g opacity="0.04" stroke="#FFF" stroke-width="1">
    <line x1="0" y1="40" x2="960" y2="40" />
    <line x1="0" y1="80" x2="960" y2="80" />
    <line x1="0" y1="120" x2="960" y2="120" />
    <line x1="0" y1="160" x2="960" y2="160" />
    <line x1="0" y1="200" x2="960" y2="200" />
    <line x1="0" y1="240" x2="960" y2="240" />
    <line x1="0" y1="280" x2="960" y2="280" />
    <line x1="0" y1="320" x2="960" y2="320" />
  </g>

  <!-- Background Animated Matrix Code Rain -->
  <g class="matrix-stream">
    <text x="40" y="45">@#$%*+=:. @#$%*+=:. @#$%*+=:. @#$%*+=:. @#$%*+=:. @#$%*+=:. @#$%*+=:.</text>
    <text x="40" y="70">01001101 01001001 01000001 // MIA MACHINE INTELLIGENCE ARCHITECTURE // #B61C1C</text>
    <text x="40" y="295">========================================================================================</text>
    <text x="40" y="320">@#$%*+=:. @#$%*+=:. @#$%*+=:. @#$%*+=:. @#$%*+=:. @#$%*+=:. @#$%*+=:.</text>
  </g>

  <!-- Hero MIA 3D ASCII Character Block -->
  <g class="ascii-text">
    <!-- Dark Shadow Layer -->
    <text x="162" y="122" fill="#2E0404" opacity="0.8">  ███╗   ███╗██╗ █████╗ </text>
    <text x="162" y="152" fill="#2E0404" opacity="0.8">  ████╗ ████║██║██╔══██╗</text>
    <text x="162" y="182" fill="#2E0404" opacity="0.8">  ██╔████╔██║██║███████║</text>
    <text x="162" y="212" fill="#2E0404" opacity="0.8">  ██║╚██╔╝██║██║██╔══██║</text>
    <text x="162" y="242" fill="#2E0404" opacity="0.8">  ██║ ╚═╝ ██║██║██║  ██║</text>

    <!-- Foreground Crimson Glowing Text -->
    <text x="160" y="120">  ███╗   ███╗██╗ █████╗ </text>
    <text x="160" y="150">  ████╗ ████║██║██╔══██╗</text>
    <text x="160" y="180">  ██╔████╔██║██║███████║</text>
    <text x="160" y="210">  ██║╚██╔╝██║██║██╔══██║</text>
    <text x="160" y="240">  ██║ ╚═╝ ██║██║██║  ██║</text>
  </g>

  <!-- Bottom Badge Pill -->
  <g transform="translate(290, 290)">
    <rect x="0" y="0" width="380" height="30" rx="15" fill="#B61C1C" fill-opacity="0.22" stroke="#FF3E3E" stroke-width="1.2" />
    <text x="190" y="19" class="badge-title" text-anchor="middle">MACHINE INTELLIGENCE ARCHITECTURE</text>
  </g>
</svg>
